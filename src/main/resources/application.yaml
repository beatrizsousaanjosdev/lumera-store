spring:
  application:
    name: lumera-store-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lumera}
    username: ${DB_USERNAME:lumera}
    password: ${DB_PASSWORD:lumera_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        "[enable.idempotence]": true
        "[max.block.ms]": 5000
        "[request.timeout.ms]": 5000
        "[delivery.timeout.ms]": 10000
    consumer:
      group-id: lumera-inventory
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
app:
  kafka:
    topics:
      product-created: lumera.product.created.v1
      product-created-dlt: lumera.product.created.v1.DLT
      order-created: lumera.order.created.v1
      order-created-dlt: lumera.order.created.v1.DLT
      stock-reservation-result: lumera.stock.reservation.result.v1
      stock-reservation-result-dlt: lumera.stock.reservation.result.v1.DLT
      payment-processed: lumera.payment.processed.v1
      payment-processed-dlt: lumera.payment.processed.v1.DLT
      payment-requested: lumera.payment.requested.v1
      payment-requested-dlt: lumera.payment.requested.v1.DLT
      stock-finalization-requested: lumera.stock.finalization.requested.v1
      stock-finalization-requested-dlt: lumera.stock.finalization.requested.v1.DLT
      stock-finalized: lumera.stock.finalized.v1
      stock-finalized-dlt: lumera.stock.finalized.v1.DLT
      order-completed: lumera.order.completed.v1
      order-completed-dlt: lumera.order.completed.v1.DLT
  outbox:
    enabled: ${OUTBOX_ENABLED:false}
    batch-size: 50
    send-timeout: 15s
    fixed-delay-ms: 5000
    initial-delay-ms: 10000
  order:
    kafka:
      enabled: ${ORDER_KAFKA_ENABLED:false}
      group-id: lumera-orders
  inventory:
    order-kafka:
      enabled: ${INVENTORY_ORDER_KAFKA_ENABLED:false}
      group-id: lumera-inventory-orders
    kafka:
      enabled: ${INVENTORY_KAFKA_ENABLED:false}
  notification:
    kafka:
      enabled: ${NOTIFICATION_KAFKA_ENABLED:false}
      group-id: lumera-notifications
  payment:
    simulator:
      decision: ${PAYMENT_SIMULATOR_DECISION:APPROVED}
    kafka:
      enabled: ${PAYMENT_KAFKA_ENABLED:false}
      group-id: lumera-payments
logging:
  level:
    com.lumera.store.lumera_store_api.catalog: DEBUG
