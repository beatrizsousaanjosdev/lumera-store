spring:
  application:
    name: lumera-store-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lumera}
    username: ${DB_USERNAME:lumera}
    password: ${DB_PASSWORD:lumera_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        "[enable.idempotence]": true
        "[max.block.ms]": 5000
        "[request.timeout.ms]": 5000
        "[delivery.timeout.ms]": 10000
    consumer:
      group-id: lumera-inventory
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
app:
  kafka:
    topics:
      product-created: lumera.product.created.v1
      product-created-dlt: lumera.product.created.v1.DLT
  outbox:
    enabled: ${OUTBOX_ENABLED:false}
    batch-size: 50
    send-timeout: 15s
    fixed-delay-ms: 5000
    initial-delay-ms: 10000
  inventory:
    kafka:
      enabled: ${INVENTORY_KAFKA_ENABLED:false}
logging:
  level:
    com.lumera.store.lumera_store_api.catalog: DEBUG
